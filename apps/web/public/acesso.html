<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>FastPro - Confirmar acesso</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/navegacao.css" />
    <link rel="stylesheet" href="/entrada.css" />
  </head>
  <body>
    <!-- fp:cabecalho -->
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <header class="fp-cab">
      <a class="fp-logo" href="/">FastPro</a>
      <nav aria-label="Principal">
        <ul class="fp-menu">
          <li><a href="/">Início</a></li>
          <li><a href="/pedido">Pedir um serviço</a></li>
          <li><a href="/painel">Meus pedidos</a></li>
          <li><a href="/entrar" aria-current="page">Entrar</a></li>
          <li><a href="/profissional/entrar">Sou profissional</a></li>
        </ul>
      </nav>
    </header>
    <!-- /fp:cabecalho -->
    <main id="conteudo" class="entrada-pagina">
      <h1>Confirmar acesso</h1>
      <p id="aviso" class="entrada-status" role="status">Carregando.</p>
      <p class="entrada-acoes">
        <button id="confirmar" class="entrada-botao" type="button" disabled>Confirmar acesso</button>
      </p>
      <p class="entrada-lista-links">
        <a id="novo-acesso" class="entrada-link" href="/entrar">Pedir novo acesso</a>
      </p>
    </main>
    <!-- fp:rodape -->
    <footer class="fp-rod">
      <nav aria-label="Rodapé">
        <ul class="fp-menu">
          <li><a href="/">Início</a></li>
          <li><a href="/pedido">Pedir um serviço</a></li>
          <li><a href="/profissional/entrar">Sou profissional</a></li>
        </ul>
      </nav>
    </footer>
    <!-- /fp:rodape -->
    <script src="/acesso.js"></script>
  </body>
</html>
