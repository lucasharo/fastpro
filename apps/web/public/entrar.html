<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>FastPro - Entrar</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/navegacao.css" />
    <link rel="stylesheet" href="/entrada.css" />
  </head>
  <body>
    <!-- fp:cabecalho -->
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <header class="fp-cab">
      <a class="fp-logo" href="/">FastPro</a>
      <nav aria-label="Principal">
        <ul class="fp-menu">
          <li><a href="/">Início</a></li>
          <li><a href="/pedido">Pedir um serviço</a></li>
          <li><a href="/painel">Meus pedidos</a></li>
          <li><a href="/entrar" aria-current="page">Entrar</a></li>
          <li><a href="/profissional/entrar">Sou profissional</a></li>
        </ul>
      </nav>
    </header>
    <!-- /fp:cabecalho -->
    <main id="conteudo" class="entrada-pagina">
      <h1>Entrar</h1>
      <p class="entrada-apoio">Informe seu e-mail. Enviamos um acesso para você continuar.</p>
      <form id="formulario" method="post" novalidate>
        <div class="entrada-campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" aria-describedby="erro-email" />
          <p id="erro-email" class="entrada-erro" role="alert"></p>
        </div>
        <p id="erro-geral" class="entrada-erro" role="alert"></p>
        <p class="entrada-acoes">
          <button id="enviar" class="entrada-botao" type="submit">Enviar acesso</button>
        </p>
        <p id="resultado" class="entrada-status" role="status"></p>
      </form>
      <p class="entrada-lista-links">
        <a class="entrada-link" href="/codigo">Digitar o código</a>
        <a class="entrada-link" href="/profissional/entrar">Sou profissional</a>
      </p>
      <noscript><p class="entrada-erro">Ative o JavaScript para continuar.</p></noscript>
    </main>
    <!-- fp:rodape -->
    <footer class="fp-rod">
      <nav aria-label="Rodapé">
        <ul class="fp-menu">
          <li><a href="/">Início</a></li>
          <li><a href="/pedido">Pedir um serviço</a></li>
          <li><a href="/profissional/entrar">Sou profissional</a></li>
        </ul>
      </nav>
    </footer>
    <!-- /fp:rodape -->
    <script src="/entrada-comum.js"></script>
    <script src="/entrar.js"></script>
  </body>
</html>
