name: CI

# Roda em push para feature/init e em PR para release/** e main.
# Sem segredos, sem Docker, sem deploy. Permissoes minimas do GITHUB_TOKEN.
on:
  push:
    branches: [feature/init]
  pull_request:
    branches: ['release/**', main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificacoes (Node 22.14, pnpm via Corepack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    # Acoes de terceiros: so as oficiais da organizacao "actions", fixadas pela tag major.
    # Verificado em 2026-11-10 via API do GitHub (somente leitura): as tags apontam para commits:
    #   actions/checkout   v7 = v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
    #   actions/setup-node v7 = v7.1.0 -> 949feb2413d6458794dcd2491c4babbbce0c15c1
    # Fixar por SHA completo (em vez de @v7) e opcional: sha_pinning_required esta false no
    # repositorio; reavaliar se a politica mudar.
    steps:
      - name: Checkout (historico completo para a varredura de segredos)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22.14.0
        uses: actions/setup-node@v7
        with:
          node-version: '22.14.0'

      - name: Ativar pnpm via Corepack (versao fixada em packageManager)
        run: |
          corepack enable
          pnpm --version

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: format:check
        run: pnpm format:check

      - name: lint (workspaces)
        run: pnpm lint

      - name: lint dos scripts
        run: pnpm lint:scripts

      - name: typecheck
        run: pnpm typecheck

      - name: test (workspaces)
        run: pnpm test

      - name: test dos scripts de verificacao
        run: pnpm test:scripts

      - name: build
        run: pnpm build

      - name: check:deps (dependencias entre workspaces)
        run: pnpm check:deps

      - name: check:boundaries (fronteiras de modulo)
        run: pnpm check:boundaries

      - name: check:hex (cor literal fora de tokens)
        run: pnpm check:hex

      - name: check:typography (Roboto 400/500/700)
        run: pnpm check:typography

      - name: check:env (.env.example so com nomes)
        run: pnpm check:env

      - name: check:attachments (chat sem anexos)
        run: pnpm check:attachments

      - name: check:logs (logs sem PII, allowlist de campos)
        run: pnpm check:logs

      - name: check:secrets (arvore e historico)
        run: pnpm check:secrets:history

      - name: audit (dependencias, nivel alto ou critico)
        run: pnpm audit --audit-level=high
